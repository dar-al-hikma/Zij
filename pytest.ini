[pytest]
testpaths = tests
# The skip guard (tests/skip_guard.py) is a plugin named here, not imported by
# conftest.py, so that no option that drops the conftest drops the guard too.
pythonpath = tests
addopts = -p skip_guard
# An xfail marker is strict unless it says otherwise: a test that passes under
# one fails the run, and the skip guard refuses one that says strict=False.
xfail_strict = true
markers =
    matrix: the full switch cross-product (slow; deselect with -m "not matrix")
    sweep: every page and the export over seeded random charts (slow; runs on CI; deselect with -m "not sweep")
filterwarnings =
    ignore::DeprecationWarning
