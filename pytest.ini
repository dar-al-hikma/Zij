[pytest]
testpaths = tests
# The skip guard (tests/skip_guard.py) is a plugin named here, not imported by
# conftest.py, so that an option that drops the conftest leaves the guard to
# refuse the run, and the conftest refuses a run without the guard. A run that
# drops both prints no "SKIP GUARD: <n> skip(s) checked" at its end.
pythonpath = tests
# Under -n, xdist's default hands each worker its tests in blocks and never takes
# one back, so the last blocks of a long file kept a few workers busy while the
# rest sat idle; worksteal lets an idle worker take tests from a busy one's
# queue. Without -n the option does nothing.
addopts = -p skip_guard --dist worksteal
# An xfail marker is strict unless it says otherwise: a test that passes under
# one fails the run, and the skip guard refuses one that says strict=False.
xfail_strict = true
markers =
    matrix: the full switch cross-product (slow; deselect with -m "not matrix")
    sweep: every page and the export over seeded random charts (slow; runs on CI; deselect with -m "not sweep")
filterwarnings =
    ignore::DeprecationWarning
