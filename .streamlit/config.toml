[runner]
# The app has no bare expressions, so magic does nothing but cost: parsing and
# rewriting the script is over half of every AppTest render.
magicEnabled = false

[client]
# The Deploy button and the toolbar are not for a study companion.
toolbarMode = "minimal"
# No outer page may steer the app when it is framed.
allowedOrigins = []

[server]
# A source run serves this computer only: Streamlit's default is every
# interface. The desktop launcher passes the same address as a flag, with the
# rest of its server options.
address = "127.0.0.1"
# A session opens only under the name a source run prints:
# Streamlit's default takes any Host, so a page whose own name is made to
# point at this computer could open one. Streamlit applies this list to the
# session's connection only, and ignores the port.
allowedHosts = ["127.0.0.1"]
# The check of a session's Origin stays on, whatever another config file says.
enableCORS = true
# Whatever another config file says: no site beyond this computer is trusted,
# uploads keep their token and its cookie stays with this site, no route runs
# the script outside a session, and no folder is served as files.
corsAllowedOrigins = []
enableXsrfProtection = true
xsrfCookieSameSite = "lax"
scriptHealthCheckEnabled = false
enableStaticServing = false
# No browser is opened by the server: open the address it prints. A run that
# is not headless lets any client on this computer have Streamlit write
# instructions for a coding agent into this folder, if one is installed.
headless = true
# The app has no file uploader, so no file's contents are taken in
# (run_source.py and the desktop app refuse the upload route itself).
maxUploadSize = 0

[browser]
# The address a source run prints and trusts; no usage statistics.
serverAddress = "127.0.0.1"
gatherUsageStats = false

[global]
# Neither development nor test mode: either lets a session stop the app.
developmentMode = false
e2eTest = false

# Generated by tools/house_style/build_theme.py from its tokens.json. Edit that, never what follows.
[theme]
font = "\"TAE Symbols\",\"TAE Symbols Sun\",\"Zij Interface\",\"Zij Interface Marks\",\"DejaVu Sans\",sans-serif"
headingFont = "\"TAE Symbols\",\"TAE Symbols Sun\",\"EB Garamond\",\"DejaVu Sans\",serif"
codeFont = "\"TAE Symbols\",\"TAE Symbols Sun\",\"Zij Numeric\",\"Zij Interface\",\"Zij Interface Marks\",\"DejaVu Sans\",monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["44px", "32px", "25px", "22px", "18px", "16px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = true

